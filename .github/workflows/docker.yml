name: container

# The MCP server goes to GHCR on every push to main, and on a version tag.
# Pull requests build but do not push, so a broken Dockerfile is caught by the
# person who broke it rather than by whoever pulls next.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The image is about 7 GB and the runner ships with roughly 14 GB free.
      # The dotnet, Android and Haskell toolchains are the biggest things
      # nothing in this build uses.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # bpy and torch are most of the image and do not change between
          # commits, but together they are past the 10 GB the Actions cache
          # allows — so the layer cache goes in the registry beside the image.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max

      # An image that starts but serves no tools is the failure worth catching:
      # bpy imports Blender's shared libraries and torch its CUDA runtime, and a
      # missing one only shows up when something asks. The runner has no GPU, so
      # this checks that the stack imports and that the tools are all there —
      # not that the card works.
      - name: The server answers
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint python \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }} -c '
          import asyncio, diffusers, torch
          from city_builder.mcp_server import server
          tools = asyncio.run(server.list_tools())
          print(f"{len(tools)} tools: " + ", ".join(t.name for t in tools))
          print(f"torch {torch.__version__}, diffusers {diffusers.__version__}")
          assert len(tools) >= 13, "the server came up short of its tools"
          '
