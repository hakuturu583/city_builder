name: container

# The MCP server goes to GHCR on every push to main, and on a version tag.
# Pull requests build but do not push, so a broken Dockerfile is caught by the
# person who broke it rather than by whoever pulls next.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-mcp

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # bpy is most of the image and does not change between commits.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that starts but serves no tools is the failure worth catching:
      # bpy imports Blender's shared libraries, and a missing one only shows up
      # at run time. So ask the built image to list its tools.
      - name: The server answers
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint python \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }} -c '
          import asyncio
          from city_builder.mcp_server import server
          tools = asyncio.run(server.list_tools())
          print(f"{len(tools)} tools: " + ", ".join(t.name for t in tools))
          assert len(tools) >= 13, "the server came up short of its tools"
          '
