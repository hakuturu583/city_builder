[project]
name = "city-builder"
version = "0.1.0"
description = "Build ground and road-surface meshes from a Lanelet2 HD map"
readme = "README.md"
license = {text = "MIT"}
# bpy publishes cp311 wheels up to 5.0.1 and cp313 from 5.1; pin to the 3.11
# line so `pip install city-builder` resolves without hunting for a Blender.
requires-python = ">=3.11,<3.12"

dependencies = [
    "bpy>=4.2,<6",
    "simple-lanelet2>=1.1",
    "shapely>=2.0",
    "scipy>=1.10",
    "numpy>=1.24,<2",   # bpy links against the 1.x ABI
    "click>=8.0",
    "pillow>=10.0",  # writing tile images; tiny, and the procedural path needs it too
    "pyyaml>=6.0",  # the config file; tiny, and every knob lives in one now
]

[project.optional-dependencies]
# Diffusion-generated textures. GPU-only, and imported lazily so the geometry
# half of the package stays fast to import and testable without any of it.
texture = [
    "torch>=2.1",
    "diffusers>=0.30",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "peft>=0.11",  # diffusers needs it to load the LCM LoRA
    "huggingface-hub>=0.23",  # `city-builder models` reads and fills the cache
]
mcp = [
    "mcp>=1.2",
]
# Turning the meshes into a 3D Gaussian Splatting cloud. The conversion itself
# is numpy and lives in `splat.py` with no GPU in it — this is the rasteriser
# that renders the result, which is how a cloud gets checked. gsplat compiles
# its CUDA kernels on first use rather than at install, so this resolves and
# installs like any wheel and then wants a toolkit the first time it runs;
# `trimesh` is what reads the GLB the mesh arrives in.
splat = [
    "gsplat>=1.5",
    "torch>=2.1",
    "trimesh",
]
# A 3D model per building, from TRELLIS.2. Its own CUDA extensions — o-voxel,
# CuMesh, FlexGEMM, nvdiffrast, nvdiffrec — are compiled against whatever torch
# ends up here and so cannot be declared: the Dockerfile builds them, and a
# source install follows the README. These are the rest of what it imports.
reconstruct = [
    "torch>=2.1",
    "transformers>=4.40",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "imageio",
    "imageio-ffmpeg",
    "easydict",
    "opencv-python-headless",
    "trimesh",
    "kornia",
    "timm",
    "ninja",
    # The commit TRELLIS.2's own setup pins. PyPI has a package of this name
    # that is not the same project, and the failure is an AttributeError deep in
    # a mesh utility rather than an install error.
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@9a4eb15e4021b67b12c460c7057d642626897ec8",
]
# TRELLIS.2's CUDA extensions. Separate from `reconstruct` because installing
# these compiles them, which wants nvcc, Eigen and about half an hour — so the
# image builds them in a stage of their own and a source install asks for them
# deliberately:
#
#     CPATH=/usr/include/eigen3 TORCH_CUDA_ARCH_LIST=12.0 uv sync --extra cuda
#
# Declared here rather than installed by hand so that they survive `uv sync`,
# which removes anything the lock file does not know about — and did, twice.
# o-voxel names CuMesh and FlexGEMM itself, so those come with it.
cuda = [
    "o-voxel @ git+https://github.com/microsoft/TRELLIS.2.git#subdirectory=o-voxel",
    "nvdiffrast @ git+https://github.com/NVlabs/nvdiffrast.git@v0.4.0",
    "nvdiffrec-render @ git+https://github.com/JeffreyXiang/nvdiffrec.git@renderutils",
]
# Everything ComfyUI needs that `texture` does not already bring. ComfyUI is a
# checkout rather than a package, so only its dependencies are declared here —
# and they are declared here rather than installed from its requirements.txt so
# one lock file decides the versions, and so torch is resolved once for the
# whole image instead of twice.
comfy = [
    "torchsde",
    "torchvision",
    "torchaudio",
    "einops",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "alembic",
    "SQLAlchemy>=2.0.0",
    "filelock",
    "av>=16.0.0",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    "psutil",
    "tqdm",
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    "comfy-angle",
    "comfy-kitchen==0.2.31",
    "comfy-aimdo==0.4.13",
    "comfyui-frontend-package==1.49.6",
    "comfyui-workflow-templates==0.11.41",
    "comfyui-embedded-docs==0.5.9",
    "gguf>=0.13.0",
    "protobuf",
]

[project.scripts]
city-builder = "city_builder.cli:main"
city-builder-mcp = "city_builder.mcp_server:main"

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_builder"]

# The `reconstruct` extra names one dependency by git commit, because the
# package of that name on PyPI is a different project.
[tool.hatch.metadata]
allow-direct-references = true

# The CUDA extensions import torch in their setup.py to find its headers, so
# they cannot be built in an isolated environment that does not have it yet.
[tool.uv]
no-build-isolation-package = ["o-voxel", "cumesh", "flex-gemm", "nvdiffrast",
                              "nvdiffrec-render"]

[tool.ruff]
line-length = 110
target-version = "py311"
